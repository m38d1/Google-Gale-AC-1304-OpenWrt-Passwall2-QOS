# v18 site configuration -- edit this file on the router, no rebuild needed.
# Sourced by zz-uplink, netled.sh and uplink-watchdog.sh. Every value is
# optional; the scripts fall back to the defaults shown here.

# --- primary uplink -------------------------------------------------------
# The internet connection. Lower metric = always preferred.
UPLINK1_SSID=""
UPLINK1_KEY=""
UPLINK1_BAND="2g"          # 2g | 5g
UPLINK1_METRIC="10"

# --- standby uplink -------------------------------------------------------
# Backup line, used only when the primary's route disappears. Put it on the
# OTHER band from the primary when you can: a radio can only listen to one
# channel, so sharing a band means the two uplanks contend for airtime and the
# standby has to sit on the primary's channel to associate at all.
# The two must be on DIFFERENT subnets. Same subnet means two routers both
# claiming to be the gateway, and the standby steals the default route.
UPLINK2_SSID=""
UPLINK2_KEY=""
UPLINK2_BAND="5g"          # 2g | 5g
UPLINK2_METRIC="20"

# --- status LED -----------------------------------------------------------
# BLUE needs an endpoint that is unreachable without a proxy. On an unfiltered
# network nothing qualifies, and the LED will sit on GREEN, which is correct.
LED_PROBE_URL="https://www.google.com/generate_204"
LED_ECHO_URL="https://api.ipify.org"
LED_PING_TARGET="8.8.8.8"
LED_SOCKS="127.0.0.1:1070"
LED_CURL_MAX="5"

# --- uplink monitor -------------------------------------------------------
# Consecutive no-carrier checks before the watchdog re-associates an uplink.
UPLINK_RECOVER_THRESHOLD="3"
